name: Build APK

# push 到 main、提 PR 时构建；打 v* 标签时额外发一个 Release 并附上 APK。
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# 同一分支上新的构建会取消上一次未完成的，省额度。
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 工程用 Java toolchain 17（见 app/build.gradle.kts），且 AGP 9 需要 JDK 17+。
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # setup-android 会装好 cmdline-tools 并把 sdkmanager 加进 PATH，同时自动接受 SDK 许可。
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # 装工程实际用到的三个包。注意 compileSdk 37 对应的包名是 platforms;android-37.0
      # （Android 16 起 SDK 引入次版本号，包名带 .0），不是 android-37。
      - name: Install SDK components
        run: sdkmanager --install "platforms;android-37.0" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FlymeFreeform-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  # 只在打标签时跑：把上一步的 APK 挂到 Release 上，便于直接下载安装。
  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: FlymeFreeform-debug-apk
          path: apk

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" apk/*.apk --title "$GITHUB_REF_NAME" --generate-notes

name: Build APK

# push 到 main、提 PR 时构建；打 v* 标签时额外发一个 Release 并附上 APK。
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# 同一分支上新的构建会取消上一次未完成的，省额度。
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 工程用 Java toolchain 17（见 app/build.gradle.kts），且 AGP 9 需要 JDK 17+。
      # ⚠️ 用 v5：v4 已被官方标为 deprecated（2026-10-10 的 CI 日志里就在报
      #    "setup-java v4 is deprecated and will no longer receive updates"）。
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 不用 android-actions/setup-android：它默认会执行 `sdkmanager tools`，
      # 而 Google 早已下架遗留的 `tools` 包，会直接报 Failed to find package 'tools'。
      # GitHub 的 ubuntu runner 本来就预装了 Android SDK 与 cmdline-tools，直接调 sdkmanager 即可。
      - name: Install Android SDK components
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | sort | tail -1)"
          echo "sdkmanager: $SDKMANAGER"
          # compileSdk 37 对应的包名是 platforms;android-37.0（Android 16 起 SDK 引入
          # 次版本号，包名带 .0），不是 android-37。
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "platforms;android-37.0" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # ★★ 必须带 `-PflymeFreeformDebugSuffix=`（等号后为空）：
      # `debug` buildType 默认给 versionName 加 `-debug` 后缀（本地调试包用来一眼分辨），
      # 而**本项目发版用的就是 debug 构建**（见 `TOOLING.md`）⇒ 不带这个参数，
      # 挂到 Release 上的 APK 版本号会是 `1.1.6-debug`，装到用户手上「关于」页也显示 `-debug`。
      # 命令行 `-P` 优先于配置文件，空串会被 `getOrElse` 原样返回（不是 null）。
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug -PflymeFreeformDebugSuffix= --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FlymeFreeform-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  # 只在打标签时跑：把上一步的 APK 挂到 Release 上，便于直接下载安装。
  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # ★★ **顺序不能反：先 checkout，再下载附件。**
      #    `actions/checkout` 默认 `clean: true`，会先跑 `git clean -ffdx` ——
      #    要是把附件先下到 `apk/`，紧接着的 checkout 会**把这个未跟踪目录删掉**，
      #    后面 `gh release create apk/*.apk` 就报 `no matches found for 'apk/*.apk'`
      #    （v1.1.7 的 tag run 就是这么挂的，日志里 download 明明成功）。
      #    另一条等价改法是给 checkout 加 `clean: false`；这里选调顺序，语义更直白。
      #
      # ★ 读标签注解要用它 ⇒ 必须 checkout，而且 `fetch-depth: 0`（默认只拉一个提交，
      #   拿不到标签对象）。
      - name: Checkout（为了读标签注解）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: FlymeFreeform-debug-apk
          path: apk

      # ★★ **必须把标签对象重新取一次**（2026-10-10 实测）：
      #    `actions/checkout` 抓标签时会把它**降级成轻量标签**（拉取带 `--no-tags` / 按 SHA
      #    写进 `refs/tags/`），于是本地那个 `v1.1.7` 指向提交、没有 tag 对象 ——
      #    `git tag -l --format='%(contents)'` 拿到的是**提交信息**（非空！所以下面那个
      #    `if` 判不出问题），`--notes-from-tag` 也照着提交信息写 ⇒ v1.1.7 的更新日志
      #    一度变成了 commit 标题。`--force --tags` 允许用远端那个**注解标签**覆盖同名轻量标签。
      - name: 取回标签对象（checkout 会把它降级成轻量标签）
        run: git fetch --force --tags --no-recurse-submodules origin

      # ★★ 三处都修过（2026-10-10）：
      #
      # ① **能重跑**：早先只有 `gh release create` 一条路 ⇒ 重跑 tag **必定失败**
      #    （`a release with the same tag name already exists: v1.1.5`，v1.1.5 的 tag run
      #    就是这么挂的）。现在先探测，已存在就只**覆盖附件**。
      #    ⚠️ 覆盖时**故意不带 --notes / --notes-file** —— 正文是人工写的，
      #       重跑把那段话冲掉才是更糟的事。
      #
      # ② **正文不再是空的**：原来用 `--generate-notes`，而本仓库**直接推 main、没有 PR**，
      #    GitHub 只能生成一行 compare 链接 ⇒ 应用内「更新日志」等于空白
      #    （用户 2026-10-10 当场发现：「没有更新日志啊」）。
      #    现在**直接用标签注解当正文** ⇒ 发版时这样打标签即可：
      #        git tag -a v1.1.7 --cleanup=verbatim -F <写好的更新日志.md>
      #    ⚠️⚠️ **必须带 `--cleanup=verbatim`**：`git tag -a -F` 默认的 cleanup 与 commit
      #        一样，会把 **`#` 开头的行当注释删掉** ⇒ `### 新增 / ### 改进 / ### 修复`
      #        这些标题在**打标签那一刻**就没了（v1.1.7 第一次发出的 Release 正文里
      #        一个标题都没有，只剩一串 bullet）。`--cleanup=verbatim` 原样保留。
      #    ⚠️ 所以**打标签时就要把更新日志写好**（用户视角的 `### 新增 / ### 改进 / ### 修复`），
      #       别再写一行摘要 —— 那段文字现在会**原样出现在 Release 页和应用内更新日志里**。
      #    ★ 这里**不用 `gh --notes-from-tag`**：它和 `--repo` 不兼容（`using
      #      --notes-from-tag with --repo is not supported`），而**读本地标签**又踩上面那个
      #      轻量标签坑。自己 `git tag -l --format='%(contents)'` 取出来、用 `--notes-file -`
      #      喂进去，两件事都不依赖 gh 的隐式行为。
      #    ⚠️ 标签没注解（真的轻量标签）时 `%(contents)` 也会回落成提交信息 —— 判定用
      #      `%(objecttype)`：只有 `tag` 才当正文，其余退回 `--generate-notes`。
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME 已存在 —— 只覆盖附件，保留现有正文"
            gh release upload "$GITHUB_REF_NAME" apk/*.apk --clobber
            exit 0
          fi
          TYPE="$(git tag -l --format='%(objecttype)' "$GITHUB_REF_NAME")"
          if [ "$TYPE" = "tag" ]; then
            echo "用标签注解当更新日志"
            git tag -l --format='%(contents)' "$GITHUB_REF_NAME" \
              | gh release create "$GITHUB_REF_NAME" apk/*.apk \
                  --verify-tag \
                  --title "$GITHUB_REF_NAME" \
                  --notes-file -
          else
            echo "标签不是注解标签（type=$TYPE）—— 退回自动生成（只会有一行 compare 链接）"
            gh release create "$GITHUB_REF_NAME" apk/*.apk \
              --verify-tag \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi

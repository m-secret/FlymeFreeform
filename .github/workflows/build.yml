name: Build APK

# push 到 main、提 PR 时构建；打 v* 标签时额外发一个 Release 并附上 APK。
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# 同一分支上新的构建会取消上一次未完成的，省额度。
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 工程用 Java toolchain 17（见 app/build.gradle.kts），且 AGP 9 需要 JDK 17+。
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 不用 android-actions/setup-android：它默认会执行 `sdkmanager tools`，
      # 而 Google 早已下架遗留的 `tools` 包，会直接报 Failed to find package 'tools'。
      # GitHub 的 ubuntu runner 本来就预装了 Android SDK 与 cmdline-tools，直接调 sdkmanager 即可。
      - name: Install Android SDK components
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | sort | tail -1)"
          echo "sdkmanager: $SDKMANAGER"
          # compileSdk 37 对应的包名是 platforms;android-37.0（Android 16 起 SDK 引入
          # 次版本号，包名带 .0），不是 android-37。
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "platforms;android-37.0" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # ★★ 必须带 `-PflymeFreeformDebugSuffix=`（等号后为空）：
      # `debug` buildType 默认给 versionName 加 `-debug` 后缀（本地调试包用来一眼分辨），
      # 而**本项目发版用的就是 debug 构建**（见 `TOOLING.md`）⇒ 不带这个参数，
      # 挂到 Release 上的 APK 版本号会是 `1.1.6-debug`，装到用户手上「关于」页也显示 `-debug`。
      # 命令行 `-P` 优先于配置文件，空串会被 `getOrElse` 原样返回（不是 null）。
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug -PflymeFreeformDebugSuffix= --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FlymeFreeform-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  # 只在打标签时跑：把上一步的 APK 挂到 Release 上，便于直接下载安装。
  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: FlymeFreeform-debug-apk
          path: apk

      # ★ 读标签注解要用它 ⇒ 必须 checkout，而且 `fetch-depth: 0`（默认只拉一个提交，
      #   拿不到标签对象）。
      - name: Checkout（为了读标签注解）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ★★ 两处都修过（2026-10-10）：
      #
      # ① **能重跑**：早先只有 `gh release create` 一条路 ⇒ 重跑 tag **必定失败**
      #    （`a release with the same tag name already exists: v1.1.5`，v1.1.5 的 tag run
      #    就是这么挂的）。现在先探测，已存在就只**覆盖附件**。
      #    ⚠️ 覆盖时**故意不带 --notes / --notes-file** —— 正文是人工写的，
      #       重跑把那段话冲掉才是更糟的事。
      #
      # ② **正文不再是空的**：原来用 `--generate-notes`，而本仓库**直接推 main、没有 PR**，
      #    GitHub 只能生成一行 compare 链接 ⇒ 应用内「更新日志」等于空白
      #    （用户 2026-10-10 当场发现：「没有更新日志啊」）。
      #    现在改为**用标签注解当正文**（`--notes-from-tag`）⇒ 发版时这样打标签即可：
      #        git tag -a v1.1.7 -F <写好的更新日志.md>
      #    ⚠️ 所以**打标签时就要把更新日志写好**（用户视角的 `### 新增 / ### 改进 / ### 修复`），
      #       别再写一行摘要 —— 那段文字现在会**原样出现在 Release 页和应用内更新日志里**。
      #    ⚠️ 标签没注解（轻量标签）时兜底回 `--generate-notes`，至少有个对比链接。
      #    ⚠️ 本 job 有 checkout 了，但仍显式带 `--repo`：不依赖 cwd 是不是 git 仓库。
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME 已存在 —— 只覆盖附件，保留现有正文"
            gh release upload "$GITHUB_REF_NAME" apk/*.apk \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
            exit 0
          fi
          if [ -n "$(git tag -l --format='%(contents)' "$GITHUB_REF_NAME")" ]; then
            echo "用标签注解当更新日志"
            gh release create "$GITHUB_REF_NAME" apk/*.apk \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "$GITHUB_REF_NAME" \
              --notes-from-tag
          else
            echo "标签没有注解 —— 退回自动生成（只会有一行 compare 链接）"
            gh release create "$GITHUB_REF_NAME" apk/*.apk \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi

org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

flymeFreeformVersionCode=105
flymeFreeformVersionName=1.0.5

# 固定签名（2026-10-06 起）。不配的话本地与 CI 各用自己机器上随机生成的调试密钥，
# 包名相同而证书不同 → Android 拒绝覆盖安装（GitHub 的跨版本之间也一样装不上）。
# 密钥随仓库提交，CI 无需任何 Secrets 即可签出与本地完全一致的包。
# 密码是公开的（私钥本身就放在仓库里），只用于「固定签名」，不构成任何安全承诺。
flymeFreeformStoreFile=keystore/flymefreeform.jks
flymeFreeformStorePassword=flymefreeform
flymeFreeformKeyAlias=flymefreeform
flymeFreeformKeyPassword=flymefreeform
